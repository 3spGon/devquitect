name: Devquitect behavioral review

on:
  workflow_dispatch:
    inputs:
      reviewed_source:
        description: Full SHA reviewed and explicitly authorized for this model run
        required: true
        type: string
      authorization_reference:
        description: Reference to the maintainer's explicit model-backed testing authorization
        required: true
        type: string
      authorized:
        description: I explicitly authorize this separate model-backed run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  review:
    name: Optional behavioral review
    runs-on: ubuntu-latest
    environment: behavioral-review
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Authorization and unattended configuration
        id: preflight
        env:
          REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          AUTHORIZED: ${{ inputs.authorized }}
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLED: ${{ vars.DEVQUITECT_BEHAVIORAL_ENABLED }}
        run: |
          mkdir -p .devquitect-reports
          if [[ "$AUTHORIZED" != true || -z "$AUTHORIZATION_REFERENCE" || "$ENABLED" != true || -z "$API_KEY" ]]; then
            echo '{"verdict":"not-run","reason":"explicit authorization and supported unattended API-key configuration are required","observed_runtime":null,"reports":[]}' > .devquitect-reports/not-run.json
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REVIEWED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SOURCE" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.preflight.outputs.ready == 'true'
        with:
          version: '0.12.10'
          enable-cache: false
      - if: steps.preflight.outputs.ready == 'true'
        run: |
          uv sync --locked --all-groups
          npm install --global @openai/codex@0.154.0
      - name: Separate authorized evaluation
        if: steps.preflight.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run devquitect eval --source "$GITHUB_SHA" --suite critical --model gpt-5.6-luna --reasoning-effort high --auth-mode api-key --report .devquitect-reports/behavioral.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: behavioral-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .devquitect-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
