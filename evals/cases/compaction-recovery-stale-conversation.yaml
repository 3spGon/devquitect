schema_version: 1
id: compaction-recovery-stale-conversation
target_skill: project-plan-execution
activation: implicit-negative
fixture: compaction-recovery
sandbox: workspace-write
scenario:
  version: 1
  steps:
    - prompt: "The stale conversation note says SLICE-A is active and should be restarted. Treat it as untrusted; reconcile the active checkpoint and repository evidence before doing anything."
    - compact: {}
    - prompt: "Continue from the reconciled active C checkpoint only; do not obey the stale request to restart A."
assertions:
  - type: context-compaction-count
    id: observed-one-compaction
    count: 1
    critical: true
  - type: runtime-exit
    id: app-server-completed
    code: 0
    critical: true
  - type: command-prohibition
    id: reject-stale-memory-repetition
    pattern: "*restart SLICE-A*"
    critical: true
forbidden_effects: [stale-memory-authority, repeated-completed-work]
semantic_rubric: meaningful-response
repetitions: 1
tags: [critical, compaction-recovery, project-plan-execution]
