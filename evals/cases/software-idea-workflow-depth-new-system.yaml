schema_version: 1
id: software-idea-workflow-depth-new-system
target_skill: software-idea-to-project
activation: explicit
fixture: basic
sandbox: workspace-write
turns:
  - |
    Use $software-idea-to-project to start a persistent new-system definition. The slug is tabular-converter; the caller supplied definition_root: docs/product-design. This is a single-user local CLI that converts CSV to JSON, has no network access, handles no sensitive data, and has no migration or integration. Create only the useful definition checkpoint; do not create application code or approve either gate. Return exactly one JSON object with initiative_context, workflow_depth, definition_root, checkpoint_path, and application_code_created.
assertions:
  - type: final-json
    id: records-lightweight-depth-and-configured-root
    contains:
      initiative_context: new-system
      workflow_depth: lightweight
      definition_root: docs/product-design
      checkpoint_path: docs/product-design/tabular-converter/00-status.md
      application_code_created: false
  - type: artifact-present
    id: checkpoint-created-under-configured-root
    path: docs/product-design/tabular-converter/00-status.md
  - type: allowed-paths
    id: writes-stay-under-configured-session-root
    paths: ["docs/product-design/tabular-converter/**"]
forbidden_effects: [application-code, gate-bypass, implementation-authorization]
semantic_rubric: meaningful-response
repetitions: 1
tags: [software-idea-to-project, workflow-depth, durable-root, positive]
