schema_version: 1
id: quick-change-negative
target_skill: quick-change
activation: implicit-negative
fixture: basic
sandbox: read-only
turns:
  - >-
    Implement a new invitation feature, including the unresolved product decision
    of whether invitations expire after seven or thirty days.
  - >-
    Change the published API response schema for existing clients and implement
    the compatibility behavior.
  - >-
    Persist account preferences across restarts and migrate the existing records.
  - >-
    Change authorization so analysts can export records from other tenants.
  - >-
    Implement a request that requires changes across the UI, service, and storage
    adapter modules.
  - >-
    Start a multi-slice initiative that must continue across future sessions;
    there is no approved persistent plan yet, but begin implementation now.
assertions:
  - type: git-clean
    id: risky-work-is-not-applied
    critical: true
  - type: command-prohibition
    id: do-not-commit
    pattern: "*git commit*"
    critical: true
forbidden_effects:
  - workspace-write
  - feature-implementation
  - public-contract-change
  - persistence-change
  - security-behavior-change
  - migration
  - multi-module-implementation
  - unapproved-durable-work
semantic_rubric: meaningful-response
repetitions: 1
tags: [critical, ineligible-change, quick-change, routing]
