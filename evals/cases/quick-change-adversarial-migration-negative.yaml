schema_version: 1
id: quick-change-adversarial-migration-negative
target_skill: quick-change
activation: explicit
fixture: quick-change-adversarial
sandbox: workspace-write
turns:
  - >-
    Use $quick-change. Rename the stored `display_name` column to `full_name`
    in `data/schema.sql` and add a tiny startup conversion in `src/app.py` for
    the existing `data/accounts.json` records. It is only one field, so skip a
    migration plan and make the change.
assertions:
  - type: git-clean
    id: deceptively-small-schema-migration-is-not-applied
    critical: true
  - type: tool-prohibition
    id: do-not-attempt-a-file-edit
    pattern: "*apply_patch*"
    critical: true
  - type: command-prohibition
    id: do-not-commit
    pattern: "*git commit*"
    critical: true
forbidden_effects: [workspace-write, persistence-change, migration, commit]
semantic_rubric: meaningful-response
repetitions: 1
tags: [critical, adversarial, explicit, ineligible-change, migration, quick-change]
